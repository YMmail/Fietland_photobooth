<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Korean Photobooth (9:16)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Glass+Antiqua&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- โซนถ่ายรูป -->
        <div id="camera-section-wrapper">
            <div id="camera-section">
                <div class="crop-guide" id="guide-top"></div>
                <video id="webcam" autoplay playsinline muted></video>
                <div class="crop-guide" id="guide-bottom"></div>
                <div class="crop-guide-side" id="guide-left"></div>
                <div class="crop-guide-side" id="guide-right"></div>
                <div id="flash-effect"></div>
                <div id="countdown-display"></div>
            </div>
            <!-- เลือกจำนวนช็อตก่อนถ่าย -->
            <div class="shot-select">
                <button class="shot-btn active" data-shots="3">3 ช็อต</button>
                <button class="shot-btn" data-shots="4">4 ช็อต</button>
            </div>
            <button class="btn-primary" id="snap-btn">📷 Take a Photo</button>
        </div>

        <!-- โซนตกแต่ง -->
        <div id="editor-layout">
            <div class="sidebar">
                <div class="tool-block">
                    <h3>🖼️ Choose your frame</h3>
                    <!-- สร้างจาก FRAMES ใน script.js -->
                    <div class="frame-thumbnails" id="frame-list"></div>
                    <button class="btn-remove" onclick="removeFrame()" style="margin-top: 10px;">❌ Delete frame</button>
                </div>
                <div class="tool-block tool-block-plain">
                    <button class="btn-retake" id="retake-btn">🔄 Retake image</button>
                </div>
            </div>

            <div class="middle-column">
                <div id="canvas-wrapper">
                    <canvas id="fabric-canvas"></canvas>
                </div>
                <div class="qr-btn-row">
                    <button class="btn-qr-get" id="qr-btn" onclick="uploadToDrive()">📱 Get QR Code</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="tool-block">
                    <h3>✨ Let's Decorate</h3>
                    <!-- สร้างจาก STICKER_CATEGORIES ใน script.js -->
                    <div class="category-tabs" id="category-tabs"></div>
                    <div id="sticker-panels"></div>
                    <button class="btn-remove" onclick="deleteSelected()" style="margin-top: 15px;">🗑️ Delete selected</button>
                </div>
                <div class="tool-block tool-block-plain">
                    <button class="btn-success" id="download-btn">💾 Save image</button>
                </div>
            </div>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal">
        <div class="qr-card">
            <h2 id="modal-title">Ready!</h2>
            <p id="modal-desc">Scan to see your photo</p>
            <div id="qr-display">
                <div class="loading-spinner"></div>
                <span>Finalizing...</span>
            </div>
            <div id="qr-link-area" style="display: none;">
                <button class="btn-remove" onclick="closeQRModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
